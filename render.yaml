services:
  - type: web
    name: samvedna-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run_server.py
    envVars:
      - key: PORT
        value: 8000
      - key: GROQ_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
